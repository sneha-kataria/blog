<div class="mb-5 position-relative main-loop-card">
	<a href="{{ site.baseurl }}{{ post.url }}" class="d-block position-relative text-white">
		<div class="post-image-wrapper" style="background-image: url('{% if post.image contains "://" %}{{ post.image }}{% else %}{{ site.baseurl }}/{{ post.image }}{% endif %}');">
		<div class="overlay"></div>
		<h2 class="post-title">{{ post.title }}</h2>
</div>
</a>
<div class="post-meta text-muted mt-2">
	<p class="excerpt">{{ post.excerpt | strip_html | strip_newlines | truncate: 186 }}</p>
	<small>
		In
		<span class="catlist">
                {% for category in post.categories %}
                    <a class="text-capitalize text-muted smoothscroll" href="{{ site.baseurl }}/categories.html#{{ category | downcase }}">{{ category }}</a>{% unless forloop.last %}, {% endunless %}
                {% endfor %}
            </span>
	</small>
</div>
</div>

<style>
	.post-image-wrapper {
		position: relative;
		width: 100%;
		height: 250px; /* Adjust as needed */
		background-size: cover;
		background-position: center;
		border-radius: 10px;
		display: flex;
		align-items: center;
		justify-content: center;
		text-align: center;
		padding: 20px;
	}

	.overlay {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(0, 0, 0, 0.5); /* Dark overlay for readability */
		border-radius: 10px;
	}

	.post-title {
		position: relative;
		font-size: 1.8rem;
		font-weight: bold;
		z-index: 2;
		color: #fff;
		margin: 0;
		padding: 15px;
		text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
	}
</style>
